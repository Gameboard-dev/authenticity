# cargo-about's settings for the third-party licence files of Authenticity's plugin and native programs
# (https://embarkstudios.github.io/cargo-about/). generate.py in this folder runs it for each program.

# Only these licences are accepted. A crate under any other licence makes the generation fail. All of them allow
# distribution in a program released under the MIT licence, Authenticity's.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    # libbz2-rs-sys (through zip, used by candle-core): the bzip2 licence, a BSD-style permissive licence
    "bzip2-1.0.6",
]

ignore-build-dependencies = true
ignore-dev-dependencies = true
# The workspace's own crates (publish = false: the plugin, the server, obsidian-kit, native-kit) are not third-party:
# they are under the MIT licence in LICENSE.
private = { ignore = true }
# Packaging quirks cargo-about knows how to correct (the licence files of ring, rustls and chrono).
workarounds = ["ring", "rustls", "chrono"]

# Clarifications: crates whose package carries no licence file (or one cargo-about cannot read), with the file taken
# from their own repository at the commit they were published from (`git`), or from the package (`files`). Each file is
# pinned by its SHA-256, so a changed file fails the check instead of being copied unread. A dual-licensed crate is
# clarified to the licence whose text exists. faer, faer-traits and zune-inflate cannot be clarified this way (faer is
# on Codeberg, which cargo-about cannot fetch from; zune-inflate names no repository): their notices are in
# additional.txt.

# rmcp's LICENSE: Apache-2.0 for new contributions, MIT for older ones not yet relicensed (its own preamble).
[rmcp.clarify]
license = "Apache-2.0 AND MIT"
[[rmcp.clarify.files]]
path = "LICENSE"
license = "Apache-2.0"
end = "END OF TERMS AND CONDITIONS"
checksum = "6c340d631a813f63edc52405453967f8f9f46c10255d5752cd41850b48ab42d3"
[[rmcp.clarify.files]]
