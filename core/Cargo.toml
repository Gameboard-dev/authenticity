[package]
name = "authenticity-core"
version = "0.3.3"
edition = "2021"
description = "Authenticity, an Obsidian plugin in Rust: offline writing checks: AI-writing scores from a local SlopTotal (GPTZero optional), wording and close paraphrase shared with the library notes, and AI characters revealed"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# The native programs (the helper that runs SlopTotal, the MCP server, check-overlap) are in ../native, a workspace of
# their own, which uses this crate's pure modules (sloptotal, ai, hints, similarity, library, chars, prose, align).

[dependencies]
obsidian-kit = { path = "../../shared" }
# The offline close-copying check against the library notes (../similar).
authenticity-similar = { path = "../similar" }
# Marks in the editor and Reading view, the hover pop-up and Copy with highlights: the workspace's shared crate (the
# system Augmented View draws with).
view-marks = { path = "../../view-marks" }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
