[package]
name = "authenticity-native"
version = "0.3.3"
edition = "2021"
description = "Authenticity's native programs: the helper that runs SlopTotal on this computer (device choice, the GPU claims the workspace's services share, idle stop), the MCP server for research assistants, and check-overlap, the close-copying check for a draft"
publish = false
license = "MIT"

# Native programs, so a workspace of their own (as Augmented View's server is): the plugin's WebAssembly workspace
# (../..) never builds them. `cargo build --release` here; the programs are in target/release.
[workspace]

[[bin]]
name = "authenticity-helper"
path = "src/bin/helper.rs"

[[bin]]
name = "authenticity-mcp"
path = "src/bin/mcp.rs"

[[bin]]
name = "check-overlap"
path = "src/bin/check_overlap.rs"

[dependencies]
# The plugin's pure modules (SlopTotal's API, the AI results, hints, the similarity check, characters, prose).
authenticity-core = { path = "../core" }
authenticity-similar = { path = "../similar" }
# The GPU's free and total memory (NVIDIA's management library, loaded at run time: no GPU, no readings), shared with
# other local services (../../native-kit, MIT).
native-kit = { path = "../../native-kit", features = ["cuda", "claims"] }
# Whether a process is still running (the GPU claims of stopped services are ignored) and the process tree of the
# SlopTotal this helper started; the version native-kit uses.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
serde_json = "1"
